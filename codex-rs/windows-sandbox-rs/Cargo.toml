[package]
build = "build.rs"
edition.workspace = true
license.workspace = true
name = "codex-windows-sandbox"
version.workspace = true

[lib]
name = "codex_windows_sandbox"
path = "src/lib.rs"
doctest = false

# Multi-AI Code 定制：这两个可执行目标不再构建。
#
# 它们只服务于 Windows 沙箱的 elevated 这一档——那一档要用一个专门创建的
# Windows 用户来跑命令，而进程一旦启动就不能改变自己的用户身份，所以必须
# 有一个独立的 exe 被 CreateProcessAsUser 拉起来当代理。
# 另外两档不需要它：disabled 不隔离，unelevated 用当前用户加受限令牌，
# 直接拉子进程就行。
#
# 而 elevated 这一档已经在 config/src/types.rs 的 WindowsSandboxModeToml
# 反序列化处被拒绝了，配置里根本写不进来，这两个 exe 也就永远不会被调用——
# 留着只是白白多出约 23.7MB 和一份构建时间。
#
# 要恢复：把下面两段注释解开，同时撤销 config/src/types.rs 里的拒绝，
# 并把主仓 scripts/build-aicli-codex.mjs 里对应两项的 bundled 改回 true。
#
# [[bin]]
# name = "codex-windows-sandbox-setup"
# path = "src/bin/setup_main/main.rs"
#
# [[bin]]
# name = "codex-command-runner"
# path = "src/bin/command_runner/main.rs"

[[bin]]
name = "codex-windows-managed-deny-probe"
path = "src/bin/managed_deny_probe/main.rs"

[lints]
workspace = true

[dependencies]
codex-http-client = { workspace = true }
anyhow = "1.0"
base64 = { workspace = true }
chrono = { version = "0.4.42", default-features = false, features = [
    "clock",
    "std",
] }
codex-utils-pty = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-string = { workspace = true }
codex-otel = { workspace = true }
dunce = "1.0"
glob = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { workspace = true, features = ["sync", "rt", "macros", "signal", "time"] }
tracing-appender = { workspace = true }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Variant",
] }

[dependencies.codex-protocol]
package = "codex-protocol"
path = "../protocol"

[dependencies.rand]
default-features = false
features = ["std", "small_rng"]
version = "0.8"

[dependencies.dirs-next]
version = "2.0"

[target.'cfg(windows)'.dependencies.windows-sys]
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_System_Console",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Security_Cryptography",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Rpc",
    "Win32_Graphics_Gdi",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Services",
]
version = "0.52"

[dev-dependencies]
pretty_assertions = { workspace = true }
